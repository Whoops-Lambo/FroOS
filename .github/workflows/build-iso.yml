name: Build FroOS VirtualBox ISO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out FroOS
        uses: actions/checkout@v4

      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common ca-certificates

      - name: Configure Debian Live
        run: |
          mkdir build
          cd build
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer none \
            --archive-areas "main contrib non-free-firmware" \
            --apt-indices false \
            --bootappend-live "boot=live components quiet"

      - name: Add FroOS desktop
        run: |
          cd build
          mkdir -p config/package-lists config/hooks/normal config/includes.chroot/opt/froos config/archives
          cp ../index.html config/includes.chroot/opt/froos/index.html

          # Use Debian's signed security repository over HTTP so bootstrap does not
          # require a CA bundle before ca-certificates has been installed.
          cat > config/archives/froos-security.list.chroot <<'APT'
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free-firmware
          APT

          cat > config/package-lists/froos.list.chroot <<'PKGS'
          ca-certificates
          live-boot
          systemd-sysv
          xorg
          xinit
          openbox
          chromium
          fonts-liberation
          dbus-x11
          x11-xserver-utils
          PKGS

          cat > config/hooks/normal/0100-froos-kiosk.hook.chroot <<'HOOK'
          #!/bin/sh
          set -e
          useradd -m -s /bin/bash froos || true
          mkdir -p /home/froos/.config/openbox
          cat > /home/froos/.xinitrc <<'EOF'
          #!/bin/sh
          exec openbox-session
          EOF
          cat > /home/froos/.config/openbox/autostart <<'EOF'
          xset s off
          xset -dpms
          xset s noblank
          sleep 2
          chromium --no-sandbox --kiosk --incognito --disable-infobars file:///opt/froos/index.html
          EOF
          cat > /etc/systemd/system/froos-kiosk.service <<'EOF'
          [Unit]
          Description=FroOS kiosk desktop
          After=systemd-user-sessions.service
          [Service]
          User=froos
          PAMName=login
          TTYPath=/dev/tty1
          TTYReset=yes
          TTYVHangup=yes
          TTYVTDisallocate=yes
          StandardInput=tty
          StandardOutput=journal
          StandardError=journal
          Environment=HOME=/home/froos
          ExecStart=/usr/bin/startx /home/froos/.xinitrc -- :0 vt1 -keeptty
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          EOF
          chown -R froos:froos /home/froos
          chmod +x /home/froos/.xinitrc
          systemctl enable froos-kiosk.service
          HOOK
          chmod +x config/hooks/normal/0100-froos-kiosk.hook.chroot

      - name: Build ISO
        run: |
          cd build
          sudo lb build

      - name: Verify ISO exists
        run: |
          set -e
          mkdir -p output
          ISO="$(find build -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "Build finished without producing an ISO file."
            exit 1
          fi
          cp "$ISO" output/FroOS-Preview-0.4.2.iso
          sha256sum output/FroOS-Preview-0.4.2.iso > output/SHA256SUMS.txt
          ls -lh output/FroOS-Preview-0.4.2.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: FroOS-VirtualBox-ISO
          path: output/*
          retention-days: 30
