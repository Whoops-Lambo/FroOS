<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FroOS Desktop Preview 0.3</title>
<style>
:root{--accent:#76e4f7;--glass:rgba(17,23,40,.72);--panel:rgba(19,25,42,.88);--text:#f5f7ff;--muted:#aab5ce;--radius:18px;--scale:1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);overflow:hidden;background:#091325}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #ffffff20;background:#ffffff0c;border-radius:11px;padding:9px 12px}button:hover{background:#ffffff20}input,textarea,select{color:var(--text);background:#ffffff0b;border:1px solid #ffffff25;border-radius:10px;padding:10px;outline:none}input:focus,textarea:focus{border-color:var(--accent)}.wall{position:fixed;inset:0;background:radial-gradient(ellipse at 18% 20%,#4d48a5 0,transparent 34%),radial-gradient(ellipse at 75% 75%,#007d9b 0,transparent 35%),linear-gradient(135deg,#0a1224,#172342 55%,#081827);transition:filter .3s}.wall:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,#ffffff08 48%,transparent 65%);pointer-events:none}
body[data-wall="sunset"] .wall{background:radial-gradient(ellipse at 70% 30%,#ffb46b,transparent 25%),radial-gradient(ellipse at 25% 80%,#a33b84,transparent 40%),linear-gradient(135deg,#251844,#b54c70)}body[data-wall="forest"] .wall{background:radial-gradient(ellipse at 70% 25%,#83d6a0,transparent 25%),radial-gradient(ellipse at 25% 80%,#126a65,transparent 40%),linear-gradient(135deg,#071c22,#174839)}body[data-wall="light"] .wall{background:radial-gradient(ellipse at 20% 20%,#d7e7ff,transparent 38%),linear-gradient(135deg,#8bb4e8,#e7f0ff)}body[data-wall="light"]{--text:#14223b;--muted:#4d5e79;--glass:rgba(239,246,255,.78);--panel:rgba(232,241,255,.92)}
#menubar{position:fixed;z-index:1000;top:0;left:0;right:0;height:38px;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--glass);backdrop-filter:blur(25px);border-bottom:1px solid #ffffff14;font-size:13px}#menubar .brand{font-weight:800;letter-spacing:.4px}#menubar .spacer{flex:1}#menubar .menuitem{opacity:.88;cursor:pointer}#menubar .menuitem:hover{opacity:1;color:var(--accent)}#desktop{position:fixed;inset:38px 0 76px;padding:22px}.desktop-icon{width:86px;min-height:82px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 4px;border-radius:13px;cursor:pointer;text-align:center;font-size:12px;text-shadow:0 1px 8px #0008}.desktop-icon:hover{background:#ffffff20}.desktop-icon .emoji{font-size:31px;filter:drop-shadow(0 3px 5px #0004)}#windows{position:absolute;inset:0;pointer-events:none}.window{position:absolute;pointer-events:auto;min-width:300px;min-height:180px;width:620px;height:420px;background:var(--panel);backdrop-filter:blur(30px);border:1px solid #ffffff2b;border-radius:var(--radius);box-shadow:0 25px 80px #0006;overflow:hidden;display:flex;flex-direction:column;resize:both}.window.active{border-color:#ffffff50;box-shadow:0 28px 90px #0008,0 0 0 1px #ffffff12}.titlebar{height:46px;flex-shrink:0;display:flex;align-items:center;padding:0 13px;gap:10px;background:#ffffff08;border-bottom:1px solid #ffffff16;cursor:move;user-select:none}.traffic{display:flex;gap:7px}.traffic span{width:11px;height:11px;border-radius:50%;display:block;cursor:pointer}.close{background:#ff625d}.min{background:#ffbd44}.max{background:#35c96b}.wtitle{font-weight:650;font-size:13px;flex:1}.winbody{padding:18px;overflow:auto;flex:1;color:var(--text)}.winbody h2{font-size:22px;margin:0 0 8px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.tile{padding:15px;border:1px solid #ffffff1c;background:#ffffff09;border-radius:15px;min-height:95px}.tile .big{font-size:25px;margin-bottom:8px}.tile strong{display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:12px;color:var(--muted)}.primary{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}.accent{color:var(--accent)}#dockwrap{position:fixed;z-index:900;bottom:12px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);padding:8px;border:1px solid #ffffff2b;background:var(--glass);backdrop-filter:blur(28px);border-radius:23px;box-shadow:0 10px 45px #0004}#dock{display:flex;align-items:end;gap:7px} .dockapp{width:49px;height:49px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:15px;position:relative;transition:transform .13s;background:#ffffff0c;border:1px solid #ffffff13;cursor:pointer}.dockapp:hover{transform:translateY(-7px) scale(1.1)}.dockapp.running:after{content:"";position:absolute;bottom:-5px;width:4px;height:4px;background:var(--accent);border-radius:50%}#startmenu{position:fixed;z-index:950;bottom:83px;left:50%;transform:translateX(-50%);width:min(540px,calc(100vw - 24px));padding:19px;border:1px solid #ffffff2b;border-radius:24px;background:var(--panel);backdrop-filter:blur(32px);box-shadow:0 25px 80px #0006;display:none}#startmenu.open{display:block;animation:pop .16s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}#startmenu input{width:100%;margin-bottom:16px}.startgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.startapp{border:0;background:transparent;padding:12px 4px;display:flex;flex-direction:column;gap:7px;align-items:center;font-size:12px}.startapp span{font-size:27px}.startbottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff1b;margin-top:16px;padding-top:14px;font-size:12px}.toast{position:fixed;z-index:2000;right:18px;top:52px;background:var(--panel);border:1px solid #ffffff2b;padding:12px 17px;border-radius:13px;box-shadow:0 10px 35px #0004;animation:toastin .2s}@keyframes toastin{from{transform:translateX(15px);opacity:0}}.context{position:fixed;z-index:1500;display:none;background:var(--panel);backdrop-filter:blur(25px);border:1px solid #ffffff2b;padding:7px;border-radius:13px;min-width:180px;box-shadow:0 15px 40px #0005}.context button{display:block;width:100%;text-align:left;border:0;background:transparent}.context button:hover{background:#ffffff20}.hidden{display:none!important}.filelist{display:flex;flex-direction:column;gap:6px}.fileitem{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:#ffffff08}.fileitem span:nth-child(2){flex:1}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#ffffff12;color:var(--muted)}.terminal{font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#050a13;color:#a3f7c2;padding:13px;border-radius:12px;min-height:210px;white-space:pre-wrap}.termline{display:flex;gap:8px;margin-top:8px}.termline input{flex:1;font-family:monospace}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.calc button{font-size:18px;padding:15px 5px}.calcdisplay{font-size:30px;text-align:right;padding:18px 12px;background:#ffffff0b;border-radius:12px;overflow:hidden}.notearea{width:100%;height:250px;resize:vertical}.range{width:100%}#notificationcenter{position:fixed;z-index:1100;right:14px;top:47px;width:310px;background:var(--panel);border:1px solid #ffffff2b;border-radius:20px;padding:17px;display:none;backdrop-filter:blur(25px)}#notificationcenter.open{display:block}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.quick button{padding:14px}.sliderline{display:flex;align-items:center;gap:12px}.sliderline input{flex:1}.badge{color:var(--accent);font-size:11px;border:1px solid #ffffff20;border-radius:20px;padding:4px 8px}.divider{height:1px;background:#ffffff19;margin:15px 0}#lockscreen{position:fixed;z-index:3000;inset:0;background:linear-gradient(135deg,#071322eF,#192c4bee),radial-gradient(ellipse at 50% 20%,#2a86a8,transparent);backdrop-filter:blur(25px);display:none;align-items:center;justify-content:center;text-align:center}#lockscreen.show{display:flex}#lockscreen h1{font-size:66px;margin:0}#lockscreen p{color:#ccd5e8}#lockscreen input{margin:12px auto;display:block;text-align:center;max-width:230px}

#workspacebar{position:fixed;z-index:880;top:48px;right:16px;display:flex;gap:5px;padding:6px;background:var(--glass);backdrop-filter:blur(22px);border:1px solid #ffffff26;border-radius:14px}
.workspace-btn{padding:6px 9px;font-size:11px}.workspace-btn.selected{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
#palette{position:fixed;z-index:2500;top:15%;left:50%;transform:translateX(-50%);width:min(540px,calc(100vw - 24px));display:none;background:var(--panel);backdrop-filter:blur(28px);border:1px solid #ffffff35;border-radius:18px;padding:14px;box-shadow:0 25px 80px #0007}
#palette.open{display:block}#palette input{width:100%;margin-bottom:10px}.palette-result{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer}.palette-result:hover{background:#ffffff18}
#widgetstack{position:fixed;z-index:100;top:92px;right:16px;width:210px;display:flex;flex-direction:column;gap:9px;pointer-events:none}.widget{pointer-events:auto;background:var(--glass);backdrop-filter:blur(22px);border:1px solid #ffffff28;border-radius:16px;padding:13px;box-shadow:0 8px 25px #0002}.widget h4{margin:0 0 8px;font-size:12px}.widget .widget-big{font-size:25px;font-weight:700}.widget small{color:var(--muted)}.widget button{font-size:11px;padding:4px 7px}
.snapbar{display:none;position:absolute;top:0;right:0;z-index:4;background:var(--panel);padding:5px;border-radius:0 0 0 12px;gap:4px}.window:hover .snapbar{display:flex}.snapbar button{font-size:11px;padding:5px 8px}
body[data-icons="minimal"] .desktop-icon .emoji{filter:none;font-size:27px}

@media(max-width:600px){#menubar{gap:9px;padding:0 9px}.hide-mobile{display:none}.window{width:calc(100vw - 22px)!important;left:11px!important;height:70vh!important;top:70px!important}.dockapp{width:42px;height:42px;font-size:22px}.startgrid{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<div class="wall"></div>
<header id="menubar"><span class="brand" onclick="openApp('about')">❄ FroOS</span><span class="menuitem hide-mobile" onclick="toggleStart()">Applications</span><span class="menuitem hide-mobile" onclick="openApp('files')">Files</span><span class="menuitem hide-mobile" onclick="openApp('settings')">Settings</span><span class="spacer"></span><span class="menuitem" id="weatherTop" onclick="notify('Weather widget is a local demo.')">☀ 72°</span><span class="menuitem" onclick="toggleNotifications()">◉</span><span id="clock">12:00</span></header>
<main id="desktop" oncontextmenu="desktopMenu(event)">
  <div class="desktop-icon" ondblclick="openApp('files')" onclick="selectIcon(this)"><span class="emoji">📁</span><span>Files</span></div>
  <div class="desktop-icon" ondblclick="openApp('browser')" onclick="selectIcon(this)"><span class="emoji">🌐</span><span>Browser</span></div>
  <div class="desktop-icon" ondblclick="openApp('notes')" onclick="selectIcon(this)"><span class="emoji">📝</span><span>Notes</span></div>
  <div class="desktop-icon" ondblclick="openApp('settings')" onclick="selectIcon(this)"><span class="emoji">⚙️</span><span>Settings</span></div>
  <div id="windows"></div>
</main>
<div id="dockwrap"><div id="dock"></div></div>
<div id="startmenu"><input id="startsearch" placeholder="Search apps, settings, and files…" oninput="filterStart(this.value)"><div class="startgrid" id="startgrid"></div><div class="startbottom"><span>👤 Local User <span class="pill">FroOS Preview</span></span><div class="row"><button onclick="lockScreen()">🔒 Lock</button><button onclick="notify('This prototype cannot power off your computer.')">⏻ Power</button></div></div></div>
<div id="notificationcenter"><div class="row"><strong>Control Center</strong><span class="spacer"></span><button onclick="toggleNotifications()">✕</button></div><div class="quick"><button onclick="toggleQuick(this)">◉ Wi-Fi<br><small>Connected</small></button><button onclick="toggleQuick(this)">ᛒ Bluetooth<br><small>On</small></button><button onclick="toggleQuick(this)">☾ Focus<br><small>Off</small></button><button onclick="toggleQuick(this)">✈ Airplane<br><small>Off</small></button></div><div class="field"><label>Brightness</label><input class="range" type="range" min="50" max="120" value="100" oninput="document.querySelector('.wall').style.filter='brightness('+this.value+'%)'"></div><div class="field"><label>Volume</label><input class="range" type="range" min="0" max="100" value="65"></div><button class="primary" onclick="openApp('settings');toggleNotifications()">All settings</button></div>
<div id="workspacebar"><button class="workspace-btn selected" onclick="switchWorkspace(0)" id="ws0">Desktop 1</button><button class="workspace-btn" onclick="switchWorkspace(1)" id="ws1">Desktop 2</button><button class="workspace-btn" onclick="switchWorkspace(2)" id="ws2">Desktop 3</button><button class="workspace-btn" title="Command palette (Ctrl+K)" onclick="togglePalette()">⌘K</button></div><div id="widgetstack"></div><div id="palette"><input id="paletteinput" placeholder="Search apps…" oninput="renderPalette(this.value)"><div id="paletteresults"></div><small>Ctrl+K to open · Esc to close · Alt+1/2/3 to switch desktops</small></div><div id="context" class="context"></div><div id="lockscreen"><div><h1 id="locktime">12:00</h1><p>FroOS is locked</p><input id="lockpin" type="password" placeholder="Enter any PIN to unlock"><button class="primary" onclick="unlockScreen()">Unlock</button></div></div>
<script>
const apps=[
{id:'home',name:'Welcome',icon:'❄',desc:'FroOS home and system overview'},
{id:'files',name:'Files',icon:'📁',desc:'Browse your demo files'},
{id:'browser',name:'Browser',icon:'🌐',desc:'Web launcher'},
{id:'settings',name:'Settings',icon:'⚙️',desc:'Personalize your desktop'},
{id:'notes',name:'Notes',icon:'📝',desc:'Quick notes'},
{id:'terminal',name:'Terminal',icon:'⌘',desc:'Command-line simulator'},
{id:'calculator',name:'Calculator',icon:'🧮',desc:'Quick calculations'},
{id:'store',name:'App Center',icon:'🛍️',desc:'Discover FroOS apps'},
{id:'tasks',name:'Task Manager',icon:'📊',desc:'Inspect running windows'},
 {id:'calendar',name:'Calendar',icon:'🗓️',desc:'Calendar and date'},
{id:'todo',name:'To-do',icon:'✅',desc:'Manage your tasks'},
{id:'widgets',name:'Widgets',icon:'🧩',desc:'Desktop widgets'},
{id:'photos',name:'Gallery',icon:'🖼️',desc:'Wallpapers and visual themes'},
{id:'themes',name:'Theme Studio',icon:'🎨',desc:'Create and save desktop themes'},
{id:'notifications',name:'Notifications',icon:'🔔',desc:'Review recent desktop notifications'},
{id:'about',name:'About FroOS',icon:'❄️',desc:'System information'}
];
let notificationHistory=JSON.parse(localStorage.getItem('froos_notification_history')||'[]');
let z=20, winCount=0, windows={}, active=null, startOpen=false, files=['Welcome.txt','FroOS-Getting-Started.md','Ideas.txt','Wallpaper-Pack','Projects','Downloads'], notesText=localStorage.getItem('froos_notes')||'Welcome to FroOS Notes!\n\nMake this desktop yours. Your notes are saved in this browser.';
const $=id=>document.getElementById(id);
function timeUpdate(){let d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});$('locktime').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
setInterval(timeUpdate,1000);timeUpdate();
function notify(msg){let stamp=new Date();notificationHistory.unshift({msg:String(msg),time:stamp.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),date:stamp.toLocaleDateString()});notificationHistory=notificationHistory.slice(0,30);try{localStorage.setItem('froos_notification_history',JSON.stringify(notificationHistory))}catch(e){};let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2800)}
function toggleStart(){startOpen=!startOpen;$('startmenu').classList.toggle('open',startOpen);if(startOpen){renderStart();$('startsearch').value='';$('startsearch').focus()}}
function renderStart(q=''){let g=$('startgrid');g.innerHTML='';apps.filter(a=>(a.name+' '+a.desc).toLowerCase().includes(q.toLowerCase())).forEach(a=>{let b=document.createElement('button');b.className='startapp';b.innerHTML=`<span>${a.icon}</span>${a.name}`;b.onclick=()=>{openApp(a.id);$('startmenu').classList.remove('open');startOpen=false};g.append(b)})}
function filterStart(q){renderStart(q)}
function renderDock(){let d=$('dock');d.innerHTML='';['home','files','browser','notes','todo','themes','settings','terminal','calculator','store'].forEach(id=>{let a=apps.find(x=>x.id===id),b=document.createElement('div');b.className='dockapp'+(windows[id]?' running':'');b.title=a.name;b.textContent=a.icon;b.onclick=()=>openApp(id);d.append(b)})}
function selectIcon(el){document.querySelectorAll('.desktop-icon').forEach(x=>x.style.background='');el.style.background='#ffffff24'}
function toggleNotifications(){$('notificationcenter').classList.toggle('open')}
function renderNotificationHistory(){let el=$('notificationhistory');if(!el)return;el.innerHTML=notificationHistory.map(n=>`<div class="fileitem"><span>🔔</span><span>${escapeHtml(n.msg)}<br><small class="muted">${escapeHtml(n.date)} · ${escapeHtml(n.time)}</small></span></div>`).join('')||'<p class="muted">No notifications yet. Use Send test to create one.</p>'}
function clearNotifications(){notificationHistory=[];localStorage.removeItem('froos_notification_history');renderNotificationHistory();notify('Notification history cleared')}
function toggleQuick(b){b.classList.toggle('primary');let s=b.querySelector('small');if(s)s.textContent=s.textContent==='On'?'Off':'On'}
function lockScreen(){$('startmenu').classList.remove('open');$('lockscreen').classList.add('show');$('lockpin').focus()}
function unlockScreen(){$('lockscreen').classList.remove('show');$('lockpin').value='';notify('Welcome back to FroOS')}
function desktopMenu(e){if(e.target.closest('.window'))return;e.preventDefault();let c=$('context');c.style.display='block';c.style.left=Math.min(e.clientX,innerWidth-210)+'px';c.style.top=Math.min(e.clientY,innerHeight-180)+'px';c.innerHTML=`<button onclick="openApp('settings');hideContext()">🎨 Personalize desktop</button><button onclick="openApp('files');hideContext()">📁 Open Files</button><button onclick="openApp('terminal');hideContext()">⌘ Open Terminal</button><button onclick="hideContext()">Cancel</button>`}
function hideContext(){$('context').style.display='none'}document.addEventListener('click',e=>{if(!e.target.closest('#context'))hideContext();if(startOpen&&!e.target.closest('#startmenu')&&!e.target.closest('#dock')){$('startmenu').classList.remove('open');startOpen=false}});
function openApp(id){if(windows[id]){if(windows[id].style.display==='none'){windows[id].style.display='flex'}focusWindow(windows[id]);return}let app=apps.find(a=>a.id===id);if(!app)return;winCount++;let w=document.createElement('section');w.className='window active';w.dataset.app=id;w.style.left=Math.max(20,Math.min(innerWidth-660,100+winCount*28))+'px';w.style.top=Math.max(55,Math.min(innerHeight-510,70+winCount*22))+'px';w.style.zIndex=++z;w.innerHTML=`<div class="titlebar"><div class="traffic"><span class="close" title="Close"></span><span class="min" title="Minimize"></span><span class="max" title="Maximize / restore"></span></div><div class="wtitle">${app.icon} ${app.name}</div><span class="pill">FroOS</span><div class="snapbar"><button onclick="snapWindow(this,'left')">◧ Left</button><button onclick="snapWindow(this,'right')">◨ Right</button><button onclick="snapWindow(this,'full')">□ Full</button></div></div><div class="winbody">${appContent(id)}</div>`;$('windows').append(w);windows[id]=w;workspaceMap[id]=currentWorkspace;localStorage.setItem('froos_workspaces',JSON.stringify(workspaceMap));w.querySelector('.close').onclick=()=>closeApp(id);w.querySelector('.min').onclick=()=>{w.style.display='none';renderDock()};w.querySelector('.max').onclick=()=>{if(w.dataset.max==='1'){w.style.left=w.dataset.left;w.style.top=w.dataset.top;w.style.width=w.dataset.width;w.style.height=w.dataset.height;w.dataset.max='0'}else{w.dataset.left=w.style.left;w.dataset.top=w.style.top;w.dataset.width=w.style.width;w.dataset.height=w.style.height;w.style.left='12px';w.style.top='48px';w.style.width='calc(100vw - 24px)';w.style.height='calc(100vh - 135px)';w.dataset.max='1'}};w.addEventListener('pointerdown',()=>focusWindow(w));dragWindow(w);focusWindow(w);renderDock();if(id==='notes')bindNotes();if(id==='settings')bindSettings();if(id==='calculator')bindCalc();if(id==='terminal')bindTerminal();if(id==='files')bindFiles();if(id==='browser')bindBrowser();if(id==='store')bindStore();if(id==='tasks')bindTasks();if(id==='calendar')bindCalendar();if(id==='photos')bindPhotos();if(id==='todo')bindTodo();if(id==='notifications')renderNotificationHistory()}
function focusWindow(w){document.querySelectorAll('.window').forEach(x=>x.classList.remove('active'));w.classList.add('active');w.style.zIndex=++z;active=w}
function closeApp(id){windows[id]?.remove();delete windows[id];renderDock()}
function dragWindow(w){let bar=w.querySelector('.titlebar'),sx,sy,ox,oy,drag=false;bar.addEventListener('pointerdown',e=>{if(e.target.closest('.traffic'))return;if(w.dataset.max==='1')return;drag=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(-w.offsetWidth+150,Math.min(innerWidth-100,ox+e.clientX-sx))+'px';w.style.top=Math.max(38,Math.min(innerHeight-80,oy+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>drag=false)}
function appContent(id){switch(id){
case'home':return `<h2>Welcome to FroOS</h2><p class="muted">A customizable desktop experience inspired by the best of desktop computing.</p><div class="cards"><div class="tile"><div class="big">✨</div><strong>Make it yours</strong><p class="muted">Themes, accent colors, wallpapers, and dock controls.</p><button onclick="openApp('settings')">Personalize</button></div><div class="tile"><div class="big">🪟</div><strong>Multitask</strong><p class="muted">Move, minimize, maximize, and layer app windows.</p><button onclick="openApp('tasks')">Task Manager</button></div><div class="tile"><div class="big">🧰</div><strong>Built-in tools</strong><p class="muted">Notes, calculator, files, terminal and more.</p><button onclick="toggleStart()">All apps</button></div></div><div class="divider"></div><p class="muted">Preview build 0.3 • Local-first demo • Settings save in this browser</p>`;
case'files':return `<h2>Files</h2><p class="muted">FroOS Home <span class="accent">›</span> Recent</p><div class="row"><input id="fileSearch" placeholder="Search files…" oninput="searchFiles(this.value)" style="flex:1"><button onclick="addFile()">＋ New file</button><button onclick="notify('Upload is a demo feature in this preview.')">↑ Upload</button></div><div class="divider"></div><div id="filelist" class="filelist"></div><p class="muted">Demo file list only; this prototype does not browse your actual disk.</p>`;
case'notes':return `<div class="row"><h2 style="flex:1">Quick Notes</h2><span class="badge">Auto-save</span></div><textarea class="notearea" id="notesarea" placeholder="Write something…"></textarea><div class="row" style="margin-top:10px"><button class="primary" onclick="saveNotes()">Save notes</button><button onclick="downloadNotes()">Export .txt</button><span class="muted" id="notestatus">Saved locally</span></div>`;

function settingsTab(tab){let c=$('settingcontent');if(!c)return;let saved=(k,d)=>localStorage.getItem('froos_'+k)||d;
if(tab==='appearance')c.innerHTML=`<h3>Appearance</h3><div class="field"><label>Accent color</label><div class="row">${['#76e4f7','#a78bfa','#fb7185','#fbbf24','#4ade80','#ffffff'].map(x=>`<button title="${x}" style="width:38px;height:38px;background:${x};border-radius:50%;padding:0" onclick="setAccent('${x}')"></button>`).join('')}</div></div><div class="field"><label>Theme mode</label><select onchange="setTheme(this.value)"><option value="dark">Frost Dark</option><option value="light">Frost Light</option></select></div><div class="field"><label>Wallpaper</label><select onchange="setWallpaper(this.value)"><option value="aurora">Aurora</option><option value="sunset">Sunset</option><option value="forest">Forest</option><option value="light">Frost Light</option></select></div><div class="field"><label>Desktop icon style</label><select onchange="setIconStyle(this.value)"><option value="default">Frosted</option><option value="minimal">Minimal</option></select></div><div class="field"><label>Window corner radius</label><input type="range" min="4" max="30" value="${saved('radius','18')}" oninput="document.documentElement.style.setProperty('--radius',this.value+'px');localStorage.setItem('froos_radius',this.value)"></div><div class="field"><label>Interface scale</label><input type="range" min="90" max="110" value="${saved('scale','100')}" oninput="document.body.style.zoom=this.value+'%';localStorage.setItem('froos_scale',this.value)"></div>`;
if(tab==='desktop')c.innerHTML=`<h3>Desktop</h3><div class="field"><label>Desktop icon labels</label><button onclick="toggleLabels()">Toggle labels</button></div><div class="field"><label>Show desktop icons</label><button onclick="toggleDesktopIcons()">Show / hide icons</button></div><div class="field"><label>Right-click desktop</label><p class="muted">Quick access to personalization, Files, and Terminal.</p></div><div class="field"><label>Lock screen</label><button onclick="lockScreen()">Preview lock screen</button></div>`;
if(tab==='dock')c.innerHTML=`<h3>Dock & taskbar</h3><div class="field"><label>Dock size</label><input type="range" min="36" max="65" value="${saved('docksize','49')}" oninput="document.querySelectorAll('.dockapp').forEach(x=>{x.style.width=this.value+'px';x.style.height=this.value+'px'});localStorage.setItem('froos_docksize',this.value)"></div><div class="field"><label>Dock position</label><select onchange="setDockPosition(this.value)"><option value="bottom">Bottom center</option><option value="left">Left side</option><option value="right">Right side</option></select></div><p class="muted">Click any dock icon to open an app. Running apps show a small accent dot.</p><button onclick="renderDock()">Reset dock icons</button>`;
if(tab==='system')c.innerHTML=`<h3>System</h3><div class="tile"><strong>Device name</strong><p class="muted">FRO-DESKTOP</p><button onclick="let n=prompt('New device name','FRO-DESKTOP');if(n){localStorage.setItem('froos_device',n);notify('Device label saved')}">Rename device</button></div><div class="field"><label>Notifications</label><button onclick="toggleNotifications()">Open Control Center</button></div><div class="field"><label>Reset personalization</label><button onclick="resetSettings()">Reset settings</button></div><div class="field"><label>Export / backup</label><button onclick="exportSettings()">Export settings JSON</button></div>`;
if(tab==='about')c.innerHTML=`<h3>About FroOS</h3><div class="tile"><div class="big">❄️</div><strong>FroOS Preview 0.1</strong><p class="muted">A local desktop shell built for experimentation.</p><p>Windows • Dock • Start menu • Themes • Notes • Files demo • Terminal simulator</p></div>`;

function bindSettings(){settingsTab('appearance');let s=localStorage.getItem('froos_theme');if(s)setTheme(s);let a=localStorage.getItem('froos_accent');if(a)setAccent(a);let w=localStorage.getItem('froos_wall');if(w)setWallpaper(w);let r=localStorage.getItem('froos_radius');if(r)document.documentElement.style.setProperty('--radius',r+'px');let sc=localStorage.getItem('froos_scale');if(sc)document.body.style.zoom=sc+'%'}
function setAccent(c){document.documentElement.style.setProperty('--accent',c);localStorage.setItem('froos_accent',c);notify('Accent color updated')}
function setTheme(t){document.body.dataset.wall=t==='light'?'light':(localStorage.getItem('froos_wall')||'aurora');if(t==='light')document.body.dataset.wall='light';else if(document.body.dataset.wall==='light')document.body.dataset.wall=localStorage.getItem('froos_wall')||'aurora';localStorage.setItem('froos_theme',t)}
function setWallpaper(w){document.body.dataset.wall=w;localStorage.setItem('froos_wall',w);if(w==='light')setTheme('light');else if(localStorage.getItem('froos_theme')==='light')localStorage.setItem('froos_theme','dark');notify('Wallpaper applied: '+w)}
function setDockPosition(p){let d=$('dockwrap');d.style.left=p==='left'?'12px':p==='right'?'auto':'50%';d.style.right=p==='right'?'12px':'auto';d.style.bottom=p==='bottom'?'12px':'auto';d.style.top=p==='bottom'?'auto':'50%';d.style.transform=p==='bottom'?'translateX(-50%)':(p==='left'?'translateY(-50%)':'translateY(-50%)');$('dock').style.flexDirection=p==='bottom'?'row':'column';localStorage.setItem('froos_dockpos',p)}
function toggleLabels(){document.querySelectorAll('.desktop-icon span:nth-child(2)').forEach(x=>x.classList.toggle('hidden'))}
function toggleDesktopIcons(){$('desktop').querySelectorAll('.desktop-icon').forEach(x=>x.classList.toggle('hidden'))}
function resetSettings(){if(confirm('Reset FroOS appearance settings?')){Object.keys(localStorage).filter(k=>k.startsWith('froos_')).forEach(k=>localStorage.removeItem(k));location.reload()}}
function exportSettings(){let data={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('froos_'))data[k]=localStorage.getItem(k)}downloadFile('froos-settings.json',JSON.stringify(data,null,2),'application/json')}
function bindNotes(){$('notesarea').value=notesText}
function saveNotes(){notesText=$('notesarea').value;localStorage.setItem('froos_notes',notesText);$('notestatus').textContent='Saved at '+new Date().toLocaleTimeString();notify('Notes saved')}
function downloadNotes(){saveNotes();downloadFile('FroOS-Notes.txt',notesText,'text/plain')}
function downloadFile(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function bindFiles(){renderFiles(files)}
function renderFiles(arr){let f=$('filelist');if(!f)return;f.innerHTML=arr.map((n,i)=>`<div class="fileitem"><span>${n.includes('Wallpaper')?'🖼️':n.includes('Projects')?'💼':n.includes('Downloads')?'⬇️':n.endsWith('.txt')||n.endsWith('.md')?'📄':'📁'}</span><span>${n}</span><span class="pill">${n.includes('.')?'Document':'Folder'}</span><button onclick="openFile('${n.replace(/'/g,"")}')">Open</button><button onclick="deleteFile('${n.replace(/'/g,"")}')">⋯</button></div>`).join('')||'<p class="muted">No files found.</p>'}
function searchFiles(q){renderFiles(files.filter(f=>f.toLowerCase().includes(q.toLowerCase())))}
function addFile(){let n=prompt('Name your new demo file','New-File.txt');if(n&&!files.includes(n)){files.push(n);renderFiles(files);notify('Demo file created')}}
function deleteFile(n){if(confirm('Remove '+n+' from this demo list?')){files=files.filter(f=>f!==n);renderFiles(files)}}
function openFile(n){if(n.endsWith('.txt')||n.endsWith('.md')){openApp('notes');notify(n+' opened in Notes demo')}else notify('Opened '+n+' (demo folder)')}
function bindBrowser(){$('browserurl').addEventListener('keydown',e=>{if(e.key==='Enter')goBrowser()})}
function browsePreset(url){$('browserurl').value=url;goBrowser()}
function goBrowser(){let u=$('browserurl').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{let parsed=new URL(u);if(!['http:','https:'].includes(parsed.protocol))throw 0;window.open(parsed.href,'_blank','noopener,noreferrer')}catch(e){notify('Please enter a valid web address')}}
let calcState={cur:'0',prev:null,op:null,reset:false};
function bindCalc(){$('calcdisplay').textContent=calcState.cur}
function calcPress(k){let s=calcState;if(k==='AC'){s.cur='0';s.prev=null;s.op=null;s.reset=false}else if(k==='⌫'){s.cur=s.cur.length>1?s.cur.slice(0,-1):'0'}else if(k==='±'){s.cur=String(-Number(s.cur))}else if(k==='%'){s.cur=String(Number(s.cur)/100)}else if(['+','−','×','÷'].includes(k)){s.prev=Number(s.cur);s.op=k;s.reset=true}else if(k==='='){if(s.op&&s.prev!==null){let b=Number(s.cur);s.cur=String(s.op==='+'?s.prev+b:s.op==='−'?s.prev-b:s.op==='×'?s.prev*b:s.prev/b);s.op=null;s.prev=null;s.reset=true}}else if(k==='.'){if(s.reset){s.cur='0.';s.reset=false}else if(!s.cur.includes('.'))s.cur+='.'}else{if(s.reset||s.cur==='0'){s.cur=k;s.reset=false}else if(s.cur.length<14)s.cur+=k}if($('calcdisplay'))$('calcdisplay').textContent=s.cur}
function bindTerminal(){$('terminput').addEventListener('keydown',e=>{if(e.key==='Enter')runTerminal()})}
function runTerminal(){let i=$('terminput'),out=$('terminalout'),cmd=i.value.trim();if(!cmd)return;let low=cmd.toLowerCase(),result='';if(low==='help')result='Available commands: help, clear, date, time, whoami, neofetch, apps, settings, files, echo [text], version';else if(low==='clear'){out.textContent='';i.value='';return}else if(low==='date')result=new Date().toDateString();else if(low==='time')result=new Date().toLocaleTimeString();else if(low==='whoami')result='local-user';else if(low==='neofetch')result='❄ FroOS Preview 0.1\\nShell: FroShell (simulated)\\nDesktop: Frost Glass\\nApps: '+Object.keys(windows).length+' open\\nPlatform: '+navigator.platform;else if(low==='apps')result=apps.map(a=>a.name).join(' • ');else if(low==='settings'){openApp('settings');result='Opening Settings…'}else if(low==='files'){openApp('files');result='Opening Files…'}else if(low==='version')result='FroOS Preview 0.3.0';else if(low.startsWith('echo '))result=cmd.slice(5);else result='Command not found: '+cmd+' (type help)';out.textContent+='\nfro@desktop:~$ '+cmd+'\n'+result+'\n';out.scrollTop=out.scrollHeight;i.value=''}
function bindStore(){}
function bindTasks(){renderTasks()}
function renderTasks(){let t=$('tasklist');if(!t)return;let activeApps=Object.keys(windows);t.innerHTML=activeApps.map(id=>{let a=apps.find(x=>x.id===id);return `<div class="fileitem"><span>${a.icon}</span><span>${a.name}</span><span class="pill">${windows[id].style.display==='none'?'Minimized':'Running'}</span><button onclick="focusWindow(windows['${id}']);windows['${id}'].style.display='flex'">Switch</button><button onclick="closeApp('${id}');renderTasks()">End task</button></div>`}).join('')||'<p class="muted">No open apps.</p>'}
function bindCalendar(){let d=new Date();$('calmonth').textContent=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});$('caldate').textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});let first=new Date(d.getFullYear(),d.getMonth(),1).getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),g=$('calendargrid');g.style.gridTemplateColumns='repeat(7,1fr)';g.innerHTML=['S','M','T','W','T','F','S'].map(x=>`<div class="tile" style="min-height:0;padding:9px;text-align:center">${x}</div>`).join('')+Array.from({length:first},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>`<button style="${i+1===d.getDate()?'border-color:var(--accent);background:#ffffff20':''}" onclick="notify('${d.toLocaleString(undefined,{month:'long'})} ${i+1}')">${i+1}</button>`).join('')}

let currentWorkspace=0;
let workspaceMap=JSON.parse(localStorage.getItem('froos_workspaces')||'{}');
let todoItems=JSON.parse(localStorage.getItem('froos_todos')||'[]');
let enabledWidgets=JSON.parse(localStorage.getItem('froos_widgets')||'["clock","date"]');
function switchWorkspace(n){currentWorkspace=n;[0,1,2].forEach(i=>{let b=$('ws'+i);if(b)b.classList.toggle('selected',i===n)});Object.entries(windows).forEach(([id,w])=>{w.style.display=(workspaceMap[id]??0)===n?'flex':'none'});notify('Switched to Desktop '+(n+1));renderDock()}
function snapWindow(btn,side){let w=btn.closest('.window');if(!w)return;w.dataset.max='0';w.style.top='52px';w.style.height='calc(100vh - 140px)';w.style.width=side==='full'?'calc(100vw - 24px)':'calc(50vw - 18px)';w.style.left=side==='right'?'calc(50vw + 3px)':'12px';if(side==='full')w.style.left='12px';focusWindow(w)}
function togglePalette(){let p=$('palette');p.classList.toggle('open');if(p.classList.contains('open')){$('paletteinput').value='';renderPalette('');$('paletteinput').focus()}}
function renderPalette(q){let el=$('paletteresults');if(!el)return;let results=apps.filter(a=>(a.name+' '+a.desc).toLowerCase().includes(q.toLowerCase())).slice(0,9);el.innerHTML=results.map(a=>`<div class="palette-result" onclick="openApp('${a.id}');$('palette').classList.remove('open')"><span style="font-size:22px">${a.icon}</span><div><strong>${a.name}</strong><br><small>${a.desc}</small></div></div>`).join('')||'<p class="muted">No matching apps.</p>'}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();togglePalette()}if(e.key==='Escape'){$('palette').classList.remove('open');hideContext()}if(e.altKey&&['1','2','3'].includes(e.key)){e.preventDefault();switchWorkspace(Number(e.key)-1)}});
function setIconStyle(style){document.body.dataset.icons=style;localStorage.setItem('froos_iconstyle',style)}
function toggleWidget(type){enabledWidgets=enabledWidgets.includes(type)?enabledWidgets.filter(x=>x!==type):[...enabledWidgets,type];localStorage.setItem('froos_widgets',JSON.stringify(enabledWidgets));renderWidgets();notify('Widget settings updated')}
function renderWidgets(){let s=$('widgetstack');if(!s)return;s.innerHTML=enabledWidgets.map(type=>{if(type==='clock')return `<div class="widget"><h4>🕒 CLOCK</h4><div class="widget-big" id="widgetclock">--:--</div><small>Local time</small></div>`;if(type==='date')return `<div class="widget"><h4>📅 TODAY</h4><strong>${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</strong><br><small>Your desktop at a glance</small></div>`;if(type==='quicknote')return `<div class="widget"><h4>📝 QUICK NOTE</h4><textarea id="widgetnote" style="width:100%;min-height:70px" placeholder="A quick thought…">${escapeHtml(localStorage.getItem('froos_widgetnote')||'')}</textarea><button onclick="localStorage.setItem('froos_widgetnote',$('widgetnote').value);notify('Widget note saved')">Save</button></div>`;return `<div class="widget"><h4>💡 FRO TIP</h4><small>Press Ctrl+K to quickly open apps, or Alt+1/2/3 to switch desktops.</small></div>`}).join('');updateWidgetClock()}
function updateWidgetClock(){let el=$('widgetclock');if(el)el.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
setInterval(updateWidgetClock,1000);
function bindTodo(){renderTodo();$('todoinput')?.addEventListener('keydown',e=>{if(e.key==='Enter')addTodo()})}
function addTodo(){let input=$('todoinput');if(!input||!input.value.trim())return;todoItems.push({text:input.value.trim(),done:false});localStorage.setItem('froos_todos',JSON.stringify(todoItems));input.value='';renderTodo()}
function toggleTodo(i){todoItems[i].done=!todoItems[i].done;localStorage.setItem('froos_todos',JSON.stringify(todoItems));renderTodo()}
function removeTodo(i){todoItems.splice(i,1);localStorage.setItem('froos_todos',JSON.stringify(todoItems));renderTodo()}
function renderTodo(){let el=$('todolist');if(!el)return;el.innerHTML=todoItems.map((t,i)=>`<div class="fileitem"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${i})"><span style="${t.done?'text-decoration:line-through;opacity:.6':''}">${escapeHtml(t.text)}</span><button onclick="removeTodo(${i})">✕</button></div>`).join('')||'<p class="muted">Nothing on your list yet.</p>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

renderDock();renderStart();renderWidgets();if(localStorage.getItem('froos_iconstyle'))setIconStyle(localStorage.getItem('froos_iconstyle'));if(localStorage.getItem('froos_dockpos'))setDockPosition(localStorage.getItem('froos_dockpos'));openApp('home');
</script></body></html>
